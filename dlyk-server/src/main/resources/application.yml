server:
  port: 8089
  servlet:
    context-path: /

#配置数据库连接相关信息
spring:
  #文件上传大小限制（线索Excel批量导入等，与前端提示的50MB保持一致）
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/dlyk?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      #最大连接数，默认是10
      maximum-pool-size: 30
      #最小空闲连接，默认是10
      minimum-idle: 30
      #等待连接池分配连接的最大时长，超过该时长还没有可用连接则发生超时异常（单位毫秒）
      connection-timeout: 5000
      #空闲连接的最大时长，空闲多久就被释放回收，设置为0不让连接回收
      idle-timeout: 0
      #一个连接的最大生命时间，超过该时间还没有使用就回收掉（单位毫秒），最好不要超过8小时
      max-lifetime: 18000000


  #配置redis的连接信息
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0

  #设置jackson返回json数据时，时区和格式
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

#指定一下mapper.xml文件的位置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    #在控制台打印sql语句
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 签名密钥，生产环境通过环境变量 JWT_SECRET 注入
jwt:
  secret: ${JWT_SECRET:dY8300olWQ3345;1d<3w48}

#定义定时任务的调度时间
project:
  task:
    cron: '* */5 * * * *'
    delay: 180000
# AI 评分引擎配置
ai:
  scoring:
    enabled: true
    deepseek:
      base-url: https://api.deepseek.com
      api-key:  ${DEEPSEEK_API_KEY}
      model-name: deepseek-v4-flash
      temperature: 0.7
      timeout: 30000
